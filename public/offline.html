<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#09090b" />
		<title>Offline · Music</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				background: #09090b;
				color: white;
			}
			body {
				min-height: 100vh;
				margin: 0;
				display: grid;
				place-items: center;
				text-align: center;
			}
			main {
				max-width: 26rem;
				padding: 2rem;
			}
			img {
				width: 4rem;
				height: 4rem;
				margin-bottom: 1rem;
			}
			p {
				color: #b8b8bd;
				line-height: 1.5;
			}
			button {
				margin-top: 1rem;
				padding: 0.75rem 1.25rem;
				border: 0;
				border-radius: 999px;
				background: #00db81;
				color: #09090b;
				font: inherit;
				font-weight: 700;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/icons/pwa-192.png" alt="" />
			<h1>You’re offline</h1>
			<p>Reconnect to browse your library and play music.</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
